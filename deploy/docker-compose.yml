# ============================================================
# QuantSystem Live Trading — Docker Compose
# ============================================================
# Usage:
#   1. Copy .env.example to .env and fill in your OKX keys
#   2. docker compose -f deploy/docker-compose.yml up -d
#   3. docker compose -f deploy/docker-compose.yml logs -f
# ============================================================

services:
  live-trader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: qs-live-trader
    restart: always
    env_file:
      - ../.env
    environment:
      - QS_LIVE_CONFIG=config/live/eth_sniper_live.yaml
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    ports:
      - "0.0.0.0:8002:8002"
    volumes:
      # Persist logs
      - qs-logs:/app/logs
      # Persist strategy state (gamma scalp pickle). Mounted at the
      # live_state SUBDIR — /app/data itself contains package code.
      - qs-data:/app/data/live_state
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  qs-logs:
  qs-data:
