# ============================================================
# Strategy Lifecycle Registry — SINGLE SOURCE OF TRUTH
# ============================================================
# Every strategy the platform knows about, with its honest lifecycle
# stage and REAL recorded numbers (no aspirational placeholders).
#
# stage:   live       — trading real money
#          paper      — shadow/paper trading with real market data
#          validated  — passed the OOS Sharpe >= 1.5 gate, awaiting paper/live
#          research   — under investigation, not deployed anywhere
#          rejected   — failed the gate; kept for the record
#          retired    — superseded / user opted out
#
# gate:    the hard rule — OOS Sharpe >= 1.5 or auto-reject.
# runnable: appears in the Backtest page runner dropdown
#           (must have a handler in dashboard/backend/routers/backtest.py).
# record:  id of the validated backtest record (see /api/backtest/records).
# ============================================================

strategies:
  # ── LIVE ────────────────────────────────────────────────────
  - id: eth_sniper
    name: ETH Momentum Sniper
    stage: live
    asset_class: crypto
    category: crypto
    symbols: ["ETH/USDT"]
    description: >
      High-leverage ETH perpetual trend-following (50x, fixed-risk sizing,
      ATR trailing stop 3.0, max hold 180 bars, 4H). Live on OKX via the
      Tokyo VPS runner.
    metrics: {backtest_sharpe: 2.03, oos_sharpe: 2.00, win_rate: 0.55, trades: 260}
    gate: {threshold: 1.5, oos_sharpe: 2.00, passed: true}
    links: {deployment: tokyo-eth-sniper, record: combo_wheel_sniper}
    notes: Sniper leg of the validated combo (corr -0.26 vs BTC wheel).

  # ── PAPER ───────────────────────────────────────────────────
  - id: spy_gamma_scalp
    name: SPY Gamma Scalp
    stage: paper
    asset_class: options
    category: options
    symbols: ["SPY"]
    description: >
      VRP harvesting: sell ATM SPY straddle + delta hedge. Paper trading
      daily (16:30 task) with real Alpaca OPRA chains.
    metrics: {backtest_sharpe: 1.98, walkforward_sharpe: 2.91, win_rate: 0.80, trades: 40}
    gate: {threshold: 1.5, oos_sharpe: 2.91, passed: true}
    runnable: true
    default_params:
      initial_capital: 100000
      contracts_per_trade: 1
      hedge_threshold_pct: 0.5
      dte_range: [3, 7]
      signal_threshold: 0.25
    links: {paper_log: gamma_scalp_daily.jsonl}
    notes: Walk-forward validated (Sharpe 2.91 across folds).

  - id: btc_wheel
    name: BTC Wheel (real Deribit chains)
    stage: paper
    asset_class: crypto_options
    category: options
    symbols: ["BTC-DERIBIT-OPTIONS"]
    description: >
      Weekly BTC strangle seller (put 0.92x / call 1.08x index, 5-9 DTE,
      hold to expiry). Paper fills at REAL Deribit bids, marks at real
      mark prices, Deribit fee model. 8-week paper judgment underway;
      first weekly settlement 2026-07-17.
    metrics: {backtest_sharpe: 1.35, oos_sharpe: 1.09, max_dd: -0.124, cagr: 0.17}
    gate:
      threshold: 1.5
      oos_sharpe: 1.09
      passed: false
      note: >
        Fails standalone; approved ONLY as the wheel leg of the validated
        combo (corr -0.26 with ETH sniper lifts combo OOS to 2.66).
    links: {paper_log: btc_wheel_daily.jsonl, record: combo_wheel_sniper}

  # ── VALIDATED (gate passed, portfolio level) ────────────────
  - id: combo_wheel_sniper
    name: "Combo: BTC Wheel + ETH Sniper (70/30)"
    stage: validated
    asset_class: portfolio
    category: portfolio
    symbols: ["BTC-DERIBIT-OPTIONS", "ETH/USDT"]
    description: >
      Portfolio-level combination: 70% BTC wheel (real DVOL x live-chain
      calibrated IV) + 30% ETH sniper. Negative leg correlation (-0.26)
      is the edge — premium selling and trend legs hedge each other's
      regime. Both legs individually deployed (wheel paper / sniper live).
    metrics: {backtest_sharpe: 2.81, oos_sharpe: 2.66, max_dd: -0.061, cagr: 0.357, correlation: -0.262}
    gate: {threshold: 1.5, oos_sharpe: 2.66, passed: true}
    links: {record: combo_wheel_sniper}
    notes: >
      First strategy to pass the gate. Caveats on record: sniper params
      in-sample; smile calibration from a single day's chain.

  # ── RESEARCH ────────────────────────────────────────────────
  - id: gamma_squeeze_scanner
    name: Gamma Squeeze Scanner
    stage: research
    asset_class: options
    category: options
    symbols: ["dynamic-universe"]
    description: >
      Daily scanner ranking gamma-squeeze candidates from Alpaca OPRA
      chains (yfinance failover). Signal research tool — no automated
      execution.
    metrics: {}
    gate: {threshold: 1.5, passed: null}

  - id: thirteenf_drift
    name: 13F Filing Drift
    stage: research
    asset_class: equity
    category: equity
    symbols: ["dynamic-universe"]
    description: >
      Celebrity-filer 13F drift via stock+margin (call-buying variant
      REJECTED — theta/spread/IV tax). EDGAR listener live on VPS;
      paper trading planned for the 2026-08-14 filing season.
    metrics: {}
    gate: {threshold: 1.5, passed: null}
    notes: OOS gate decision deferred to Aug-14 filing season paper run.

  # ── RETIRED ─────────────────────────────────────────────────
  - id: btc_sniper
    name: BTC Momentum Sniper v5
    stage: retired
    asset_class: crypto
    category: crypto
    symbols: ["BTC/USDT"]
    description: >
      High-leverage BTC perp trend-following (50x, fixed-risk, Donchian +
      EMA21 pullback, 4H). Superseded by the ETH variant which went live;
      user decision: do NOT paper trade this one. Kept runnable for
      research backtests.
    metrics: {backtest_sharpe: 1.68, win_rate: 0.546, trades: 260}
    gate: {threshold: 1.5, oos_sharpe: 1.68, passed: true}
    runnable: true
    default_params:
      leverage: 50.0
      risk_per_trade: 0.05
      atr_stop: 3.5
      atr_trail: 2.5
      min_score: 2
      initial_capital: 10000
    notes: Retired by user decision 2026-07-10 — live capital is on eth_sniper.

  # ── REJECTED (real recorded verdicts) ───────────────────────
  - id: crypto_macro_cycle
    name: BTC/ETH Macro Cycle
    stage: rejected
    asset_class: crypto
    category: crypto
    symbols: ["BTC/USDT", "ETH/USDT"]
    description: 5x leveraged macro-cycle composite scoring, 4H.
    metrics: {backtest_sharpe: 0.41, win_rate: 0.626, trades: 222}
    gate: {threshold: 1.5, oos_sharpe: 0.41, passed: false}
    runnable: true
    default_params: {leverage: 5.0, max_trades_per_day: 3, lookback: 60, composite_threshold: 0.7}

  - id: tsmom_diversified
