# ============================================================
# Strategy Lifecycle Registry — SINGLE SOURCE OF TRUTH
# ============================================================
# Every strategy the platform knows about, with its honest lifecycle
# stage and REAL recorded numbers (no aspirational placeholders).
#
# stage:   live       — trading real money
#          paper      — shadow/paper trading with real market data
#          validated  — passed the OOS Sharpe >= 1.5 gate, awaiting paper/live
#          research   — under investigation, not deployed anywhere
#          rejected   — failed the gate; kept for the record
#          retired    — superseded / user opted out
#
# gate:    the hard rule — OOS Sharpe >= 1.5 or auto-reject.
# runnable: appears in the Backtest page runner dropdown
#           (must have a handler in dashboard/backend/routers/backtest.py).
# record:  id of the validated backtest record (see /api/backtest/records).
# ============================================================

