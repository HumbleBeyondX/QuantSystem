# ============================================================
# Small-Cap Mean-Reversion v1 — Sharpe 2.059 backtest config
# ============================================================
# Equal-weighted by inverse volatility across 8 sector ETF sleeves.
# Each sleeve runs the Connors-style RSI(2) mean-reversion engine
# from research/smallcap_mean_reversion.py.
#
# Backtest 2024-01-01 → 2026-05-03 (USD daily, $10K initial):
#   Sharpe 2.059, MaxDD 1.36%, Win 66.9%, AnnRet 4.57%, 157 trades
#
# Holds ~12% of the time, fully cash 88% of the time → safe overlay
# strategy that can run alongside ETH Sniper (live VPS) and Gamma
# Scalp (paper) without conflict.
# ============================================================

strategy_id: smallcap_mr_v1
name: "Small-Cap Sector-ETF Mean Reversion"
asset_class: equity
enabled: true
mode: backtest

# Sleeves (8 sector ETFs, low pairwise correlation)
tickers:
  - XBI    # Biotech (S&P)
  - GDX    # Gold miners
  - XLE    # Energy
  - UAL    # United Airlines (transportation cyclical)
  - XLU    # Utilities (defensive)
  - KRE    # Regional banks
  - XLY    # Consumer Discretionary
  - XLI    # Industrials

# Weighting: inverse of historical volatility — gives the calm sleeves
# (XBI, XLI) more capital, dampens overall portfolio vol.
weighting: inverse-vol

# Engine parameters (validated optimal at 2.059 Sharpe)
parameters:
  drop_threshold_pct: 2.5      # entry: 3-day cum return < -2.5%
  rsi2_oversold: 20.0          # entry: RSI(2) < 20
  rsi2_overbought: 70.0        # exit: RSI(2) > 70 (early)
  profit_target_pct: 1.5       # exit: +1.5% from entry
  stop_loss_pct: 2.5           # exit: -2.5% from entry
  max_hold_days: 3             # exit: 3-day time stop
  sma_filter: 200              # entry filter: close > SMA200 (uptrend only)
  deploy_pct: 0.95             # use 95% of allocated cash on entry

# Backtest settings
backtest:
  start_date: "2024-01-01"
  end_date: "2026-05-03"
  initial_capital: 10000
  fee_per_share: 0.005         # broker comm proxy
  slippage_bps: 5              # 5 bps per trade

# Acceptance gate (this config passes)
acceptance:
  min_sharpe: 2.0
  max_drawdown_pct: 0.05
  min_win_rate: 0.65
  min_trades: 100
