# Crypto Mid-Frequency Microstructure Strategy
# Combines orderbook imbalance, trade flow, microprice, whale activity,
# spread dynamics, and VPIN on 5-15min bars.
#
# Designed for retail: cost-aware, depth-adaptive, no HFT assumptions.
# Target: BTC/USDT, ETH/USDT on Binance (most liquid = lowest cost).

strategy_id: crypto_microstructure
name: Crypto Microstructure MidFreq
asset_class: CRYPTO
symbols:
  - BTC/USDT
  - ETH/USDT
enabled: true
mode: paper

parameters:
  # ── Timeframe ──
  bar_timeframe: "5m"        # 5-minute bars
  min_warmup_bars: 20        # Need 20 bars (~1.5h) before first signal

  # ── Factor weights (sum ≈ 1.0) ──
  weight_obi: 0.30           # Order Book Imbalance — most reliable
  weight_tfi: 0.25           # Trade Flow Imbalance — confirmed aggression
  weight_microprice_dev: 0.20 # Microprice deviation — subtle pressure
  weight_whale: 0.10         # Whale trade detection — event signal
  weight_spread_zscore: 0.10 # Spread dynamics — entry quality
  weight_vpin: 0.05          # VPIN — contrarian risk signal (low weight)

  # ── Orderbook parameters ──
  depth_levels: 10           # Aggregate top 10 bid/ask levels
  obi_decay: 0.94            # EMA decay for OBI smoothing

  # ── Trade flow ──
  tfi_window_seconds: 300    # 5-minute window for trade classification
  whale_multiplier: 10.0     # Trade > 10x median = whale

  # ── VPIN ──
  vpin_n_buckets: 50         # Volume buckets for VPIN computation

  # ── Spread ──
  spread_lookback: 50        # Bars for rolling spread stats
  max_spread_bps: 15.0       # Skip trading when spread > 15bps

  # ── Signal thresholds ──
  entry_threshold: 0.35      # Composite must exceed ±0.35 to enter
  exit_threshold: 0.15       # Exit when composite decays below 0.15
  composite_scale: 50.0      # expected_move_bps = |composite| × this

  # ── Cost model (Binance VIP0) ──
  maker_fee_rate: 0.0002     # 0.02% maker
  taker_fee_rate: 0.0004     # 0.04% taker
  base_slippage_bps: 1.0     # Minimum slippage even in deep books
  depth_impact_factor: 0.05  # Market impact scaling factor
  min_profit_to_cost_ratio: 2.0  # Must expect 2× round-trip cost

  # ── Position sizing ──
  max_position_usd: 5000     # Max $5K per position (retail-friendly)
  position_scale_by_strength: true  # Larger size for stronger signals

  # ── Risk management ──
  stop_loss_bps: 30.0        # Hard stop at 30bps (0.3%)
  max_daily_trades: 50       # Cap daily trades to limit fee bleed
  cooldown_base_seconds: 60  # 60s cooldown after a loss
  max_consecutive_losses: 3  # After 3 losses → extended cooldown
  extended_cooldown_minutes: 30  # 30-min pause after consecutive losses
