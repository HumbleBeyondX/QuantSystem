# OKX Perpetual Futures Configuration
exchange_id: okx
display_name: "OKX Derivatives"

# Connection
sandbox: true  # Set false for live trading — OKX uses "demo trading" mode
demo_trading: true  # OKX-specific: demo trading flag

# Rate limits
rate_limit_ms: 100
max_requests_per_minute: 600

# Default trading parameters
default_leverage: 3
default_margin_type: cross  # cross / isolated
default_type: swap
inst_type: SWAP  # OKX-specific: SPOT, SWAP, FUTURES, OPTION
position_mode: net_mode  # net_mode / long_short_mode

# Supported asset classes
asset_classes:
  - crypto_perp
  - crypto_spot

# Fee schedule (USDT-M swaps, VIP 0)
fees:
  maker: 0.0002  # 0.02%
  taker: 0.0005  # 0.05%

# Default symbols
default_symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT

# Safety — CRITICAL: withdrawal explicitly blocked at engine level
withdrawal_enabled: false
max_position_notional_usd: 50000
max_leverage: 20

# OKX-specific notes:
# - API key creation: enable "Trade" permission ONLY, disable "Withdraw"
# - IP whitelist recommended for production
# - passphrase required in addition to api_key + secret
